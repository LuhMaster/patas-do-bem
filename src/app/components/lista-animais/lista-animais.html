<section
  class="lista-animais"
  [style.--escala-texto]="escalaTexto"
>
  <div class="acessibilidade">
  <span>Tamanho do texto:</span>

  <button
    type="button"
    (click)="diminuirTexto()"
    [disabled]="escalaTexto <= 0.8"
    aria-label="Diminuir tamanho do texto"
  >
    A−
  </button>

  <button
    type="button"
    (click)="aumentarTexto()"
    [disabled]="escalaTexto >= 1.5"
    aria-label="Aumentar tamanho do texto"
  >
    A+
  </button>
</div>
  <div class="filtros-container">
    <div class="campo-busca">
      <label for="busca">Buscar animal</label>

      <input
        id="busca"
        type="text"
        name="busca"
        [(ngModel)]="busca"
        placeholder="Digite o nome ou localização..."
      />
    </div>

    <div class="botoes-filtro">
      
<button
  type="button"
  class="filtro-todos"
  (click)="filtrar('Todos')"
  [class.ativo]="filtroAtual === 'Todos'"
>
  Todos
</button>

<button
  type="button"
  class="filtro-perdido"
  (click)="filtrar('Perdido')"
  [class.ativo]="filtroAtual === 'Perdido'"
>
  Perdidos
</button>

<button
  type="button"
  class="filtro-encontrado"
  (click)="filtrar('Encontrado')"
  [class.ativo]="filtroAtual === 'Encontrado'"
>
  Encontrados
</button>

<button
  type="button"
  class="filtro-adocao"
  (click)="filtrar('Adoção')"
  [class.ativo]="filtroAtual === 'Adoção'"
>
  Adoção
</button>

    </div>
  </div>

  <div class="resultado-animais">
    @for (animal of animaisFiltrados; track animal.id) {
      <app-cartao-animal [animal]="animal" />
    } @empty {
      <p class="mensagem-vazia">Nenhum animal encontrado. Tente alterar sua busca ou filtro.</p>
    }
  </div>
</section>
