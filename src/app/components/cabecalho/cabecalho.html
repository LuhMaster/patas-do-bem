
<header class="cabecalho">
  <div class="identidade">
    <img src="/images/logo.png" alt="Logo Patas do Bem" class="logo" />

    <div class="textos">
      <h1>Patas do Bem</h1>
      <p>Encontre animais perdidos, encontrados e disponíveis para adoção.</p>
    </div>
  </div>

  <button
    class="botao-menu"
    type="button"
    (click)="alternarMenu()"
    [attr.aria-expanded]="menuAberto"
    aria-label="Abrir ou fechar menu"
  >
    ☰ MENU
  </button>

  @if (menuAberto) {
    <nav class="menu-navegacao" aria-label="Menu principal">

      <a routerLink="/" (click)="fecharMenu()">Início</a>

      <a routerLink="/" fragment="consulta" (click)="fecharMenu()">
        Consultar animais
      </a>

      @if (autenticacaoService.estaLogado()) {
        <a routerLink="/cadastro-animal" (click)="fecharMenu()">
          Cadastrar animal
        </a>

        <button
          class="botao-voluntario"
          type="button"
          (click)="sair()"
        >
          Sair
        </button>
      } @else {
        <a routerLink="/login" (click)="fecharMenu()">
          Área do voluntário
        </a>
      }

    </nav>
  }
</header>
